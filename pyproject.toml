[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headvox"
version = "0.1.0"
description = "Turn a script into a talking-head voiceover with word-aligned SRT/VTT captions. Chinese, English and Japanese, free neural voices, one command."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HeadVox contributors" }]
keywords = [
  "tts", "text-to-speech", "voiceover", "talking-head", "subtitles", "srt", "vtt",
  "captions", "edge-tts", "chinese-tts", "ai-voice", "video", "ffmpeg", "youtube", "shorts",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
edge = ["edge-tts>=7.0"]
dev = ["pytest>=7"]

[project.scripts]
headvox = "headvox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/yyert123/headvox"
Source = "https://github.com/yyert123/headvox"
Issues = "https://github.com/yyert123/headvox/issues"
Demo = "https://huggingface.co/spaces/headvox/headvox"
