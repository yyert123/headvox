[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headvox"
version = "0.1.2"
description = "Script to voiceover with word-aligned SRT/VTT captions and per-word JSON timings, in one command. Open-source TTS CLI for talking-head videos, explainers and Shorts. Chinese, English, Japanese."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HeadVox contributors" }]
keywords = [
  "text-to-speech", "tts", "voiceover", "voiceover-generator", "ai-voiceover", "narration",
  "subtitles", "subtitle-generator", "captions", "srt", "webvtt", "word-timestamps", "forced-alignment",
  "talking-head", "faceless-video", "youtube-shorts", "tiktok", "short-video",
  "edge-tts", "neural-voice", "chinese-tts", "japanese-tts", "ffmpeg", "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
edge = ["edge-tts>=7.0"]
dev = ["pytest>=7"]

[project.scripts]
headvox = "headvox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/yyert123/headvox"
Source = "https://github.com/yyert123/headvox"
Issues = "https://github.com/yyert123/headvox/issues"
Demo = "https://huggingface.co/spaces/headvox/headvox"
Documentation = "https://github.com/yyert123/headvox#readme"
"简体中文" = "https://github.com/yyert123/headvox/blob/main/README.zh-CN.md"
"日本語" = "https://github.com/yyert123/headvox/blob/main/README.ja.md"
Changelog = "https://github.com/yyert123/headvox/blob/main/CHANGELOG.md"
